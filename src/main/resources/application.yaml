spring:
  application:
    name: StudentSystem

  profiles:
    active: dev

  jwt:
    secretKey: ${JWT_SECRET}
    accessTokenExpiration: ${ACCESS_EXPIRATION}
    refreshTokenExpiration: ${REFRESH_EXPIRATION}

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: file:uploads/

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_NAME}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true