databaseChangeLog:
  - changeSet:
      id: 601-create-invoices-table
      author: sorl vichika
      created: 21-04-2026
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: invoice_no
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: total_amount
                  type: double
                  constraints:
                    nullable: false

              - column:
                  name: paid_amount
                  type: double
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: issue_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: created_by
                  type: VARCHAR(100)

              - column:
                  name: updated_by
                  type: VARCHAR(100)

              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: deleted_at
                  type: TIMESTAMP

        - addUniqueConstraint:
            tableName: invoices
            columnNames: invoice_no
            constraintName: uk_invoices_invoice_no

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_invoice_student

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_student
            columns:
              - column:
                  name: student_id

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_issue_date
            columns:
              - column:
                  name: issue_date

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_due_date
            columns:
              - column:
                  name: due_date

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_deleted
            columns:
              - column:
                  name: deleted