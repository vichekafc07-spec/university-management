databaseChangeLog:
  - changeSet:
      id: 107-create-student-classrooms-table
      author: sorl vichika
      created: 06-05-2026
      changes:

        - createTable:
            tableName: student_classrooms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: classroom_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: sc_year
                  type: INT

              - column:
                  name: semester
                  type: INT

              - column:
                  name: generation
                  type: INT

              - column:
                  name: status
                  type: VARCHAR(80)

              - column:
                  name: assigned_date
                  type: DATE

        - addForeignKeyConstraint:
            baseTableName: student_classrooms
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_student_classrooms_student

        - addForeignKeyConstraint:
            baseTableName: student_classrooms
            baseColumnNames: classroom_id
            referencedTableName: classrooms
            referencedColumnNames: id
            constraintName: fk_student_classrooms_classroom

        - addUniqueConstraint:
            tableName: student_classrooms
            columnNames: student_id, classroom_id
            constraintName: uk_student_classrooms

        - createIndex:
            tableName: student_classrooms
            indexName: idx_sc_student
            columns:
              - column:
                  name: student_id

        - createIndex:
            tableName: student_classrooms
            indexName: idx_sc_classroom
            columns:
              - column:
                  name: classroom_id

        - createIndex:
            tableName: student_classrooms
            indexName: idx_sc_year_semester
            columns:
              - column:
                  name: sc_year
              - column:
                  name: semester

        - createIndex:
            tableName: student_classrooms
            indexName: idx_sc_status
            columns:
              - column:
                  name: status